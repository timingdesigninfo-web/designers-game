<title>XD戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one-screen chronicle board — HUD on top, stage in the middle, cards at the thumb */
:root{
  --ink:#140d1a; --panel:#20162b; --panel2:#2a1d38; --line:#3d2d4d;
  --fg:#f4edf7; --mute:#a897b5; --accent:#ff5cc8; --gold:#ffcf5a;
  --atk:#ff6b5e; --def:#5ab8ff; --skl:#c07cff; --heal:#5be0a0; --junk:#8a7a96;
  --display:'DotGothic16',ui-monospace,'Osaka-Mono',monospace;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{line-break:strict;word-break:auto-phrase;text-wrap:pretty;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:4px;padding:12px 18px;font-family:var(--display);font-size:16px;letter-spacing:.04em;box-shadow:0 4px 0 #8a2a6c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a2a6c}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.card:focus-visible,.opt:focus-visible,.node:focus-visible,.ib:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mute{color:var(--mute)}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-block:6px}
.kicker{font-family:var(--display);color:var(--gold);letter-spacing:.2em;font-size:13px;margin:0}
.lead{margin:0;max-width:34em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:140px}

/* HUD */
.hud{display:flex;align-items:center;gap:8px}
.hud .yr{font-family:var(--display);color:var(--gold);font-size:18px}
.hud .ct{font-family:var(--display);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spdbtn.on{background:#e8a33a!important;border-color:#ffe27a!important;color:#2a1500!important;box-shadow:0 0 6px #ffcf5a}.spdbtn{font-size:11px!important;padding:0 6px!important;white-space:nowrap}.rcol .info .hud{flex-wrap:wrap;justify-content:flex-end}
.ib{flex:none;min-width:34px;height:30px;padding:0 8px;border-radius:4px;background:var(--panel);border:2px solid var(--line);font-family:var(--display);font-size:13px;display:grid;place-items:center}
.stat{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:12px;color:var(--mute);flex-wrap:wrap}
.stat b{font-weight:400;color:var(--fg)}
.ver{color:var(--accent)!important}
.xpbar{width:64px;height:6px;background:var(--panel2);border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:var(--accent)}
.lampbar{display:inline-flex;align-items:center;gap:3px}.lampbar i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2a2238;border:1px solid #4a3f66}.lampbar i.on{background:radial-gradient(circle,#fff6c8,#ffcf5a 60%,#e08a2a);border-color:#ffe08a;box-shadow:0 0 6px #ffcf5a}
.btop .mini.cr i{background:linear-gradient(90deg,#ff9ad0,#ffd0ee)}
.fglow{box-shadow:0 0 14px 2px #ffb0e8,inset 0 0 10px #ffb0e855!important;transition:box-shadow .3s}
.ptoast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;background:linear-gradient(#2b2140,#1c1530);border:2px solid #ffcf5a;border-radius:8px;padding:10px 18px;text-align:center;color:#fff3c4;box-shadow:0 0 18px #ffcf5a88;animation:ptin .35s ease-out;pointer-events:none}.ptoast b{display:block;font-size:1.15em;color:#ffe27a}.ptoast small{color:#e9dcff}
@keyframes ptin{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}

/* title & story */
.logo{font-family:var(--display);font-size:clamp(56px,18vw,96px);line-height:1;letter-spacing:.06em;margin:0}
.logo img{display:block;margin:0 auto;width:min(86vw,420px);max-height:22vh;object-fit:contain;image-rendering:pixelated}
.year{font-family:var(--display);font-size:clamp(72px,26vw,120px);line-height:.9;color:var(--gold);margin:0}
.ctitle{font-family:var(--display);font-size:24px;font-weight:400;margin:0;text-wrap:balance}
.timeline{display:flex;gap:4px}
.timeline i{flex:1;height:4px;background:var(--line)}
.timeline i.done{background:var(--accent)} .timeline i.now{background:var(--gold)}
.hero-stage{display:flex;align-items:flex-end;gap:16px}
.talk{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:14px}
.talk img{flex:none;width:96px;height:116px;object-fit:contain;object-position:center bottom}
.talk .who{font-family:var(--display);color:var(--gold);font-size:14px}
.talk p{margin:4px 0 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.opt b{font-family:var(--display);font-weight:400;font-size:17px}
.opt:hover{border-color:var(--accent)}

/* map */
.map{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:0;padding-block:8px;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.mrow{display:flex;gap:28px;justify-content:center}
.link{width:2px;height:22px;background:repeating-linear-gradient(var(--mute) 0 4px,transparent 4px 8px);opacity:.6}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px}
.node .sq{width:58px;height:58px;display:grid;place-items:center;font-family:var(--display);font-size:28px;background:var(--panel);border:3px solid var(--line);border-radius:4px;box-shadow:0 4px 0 #0008}
.node .lb{font-family:var(--display);font-size:12px;color:var(--mute)}
.node.now .sq{border-color:var(--gold);animation:bob 1s steps(2) infinite}
.node.now .lb{color:var(--fg)}
.node.done .sq{border-color:var(--accent);opacity:.6}
.node.skip,.node.future{opacity:.45;cursor:default}
.node.boss .sq{width:70px;height:70px;font-size:34px;color:var(--atk)}
@keyframes bob{50%{transform:translateY(-3px)}}

/* battle */
.stage{position:relative;display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:12px}
.stage .spr{flex:none;width:96px;height:96px}
.stage.boss .spr{width:112px;height:112px}
.ui{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.nm{font-family:var(--display);font-size:17px;line-height:1.2}
.nm small{font-family:var(--body);font-size:11px;color:var(--mute);margin-left:6px}
.bar{position:relative;height:16px;background:var(--ink);border:2px solid var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--atk);transition:width .35s steps(6)}
.me .bar i{background:var(--heal)}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:11px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:20px;align-items:center}
.chip{font-size:11px;border-radius:2px;padding:0 6px;background:var(--panel2);border:1px solid var(--line)}
.chip.def{color:var(--def);border-color:var(--def)} .chip.str{color:var(--accent);border-color:var(--accent)}
.chip.weak{color:var(--gold);border-color:var(--gold)} .chip.sv{color:var(--heal);border-color:var(--heal)}
.intent{position:absolute;top:-12px;right:10px;font-family:var(--display);font-size:12px;background:var(--ink);border:2px solid var(--atk);color:var(--atk);padding:0 8px}
.intent.calm{border-color:var(--def);color:var(--def)}
.me{position:relative;display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:8px 10px}
.me .spr{flex:none;width:52px;height:52px}
.energy{display:flex;gap:3px;align-items:center}
.energy i{width:13px;height:13px;border:2px solid var(--gold)}
.energy i.on{background:var(--gold)}
.energy span{font-family:var(--display);font-size:12px;color:var(--gold);margin-left:4px}
.log{margin:0;min-height:2.6em;font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;line-height:1.4}
.log b{color:var(--fg)}
.hand{flex:1;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:6px;overflow-y:auto;padding:4px 2px 6px}
.hand .card{width:min(108px,calc((100% - 12px)/3))}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl .piles{flex:1;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.float{position:absolute;top:20%;font-family:var(--display);font-size:22px;pointer-events:none;animation:up .9s steps(9) forwards;text-shadow:2px 2px 0 var(--ink);z-index:2}
.float.dmg{color:var(--atk)} .float.blk{color:var(--def)} .float.hp{color:var(--heal)} .float.pw{color:var(--accent)}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-36px);opacity:0}}
.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{animation:flash .4s steps(3)}
@keyframes flash{0%{background:var(--atk)}100%{background:var(--panel)}}

.opt:disabled{opacity:.45;cursor:default}
.opt:disabled:hover{border-color:var(--line)}

/* opening movie */
.op.rot{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;transform:translateX(100vw) rotate(90deg);z-index:50}
.op{position:relative;height:100%;display:grid;place-items:center;background:#000;overflow:hidden}
.op .stage{position:relative;overflow:hidden;background:#000;--u:3px}
.op canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.op .cw{position:absolute;inset:0;perspective:400px;perspective-origin:50% 32%;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(to top,#000 42%,transparent 90%);mask-image:linear-gradient(to top,#000 42%,transparent 90%)}
.op .crawl{position:absolute;left:50%;bottom:0;width:max-content;white-space:nowrap;transform-origin:50% 100%;transform:translateX(-50%) rotateX(52deg);text-align:center;font-family:var(--display);color:#ffd24d;line-height:1.75;font-size:20px;text-shadow:0 0 .35em #000,0 0 .7em #000,.1em .1em 0 #5a3d00;will-change:transform;opacity:0;transition:opacity 2s}
.op .crawl p{margin:0 0 1.1em}
.op .crawl p.gp{margin:0}
.op .crawl .h{font-size:1.5em;letter-spacing:.14em;color:#fff2b8}
.op .crawl .hb{font-size:1.5em;letter-spacing:.14em;color:#fff2b8;font-weight:400}
.op .crawl .yr{font-size:1.1em;color:#ff9bd8}
.op .camlayer{position:absolute;inset:0;z-index:0;pointer-events:none}
.op .cam.fly{bottom:auto!important;top:30%}
@keyframes flyb{0%,100%{margin-top:0}50%{margin-top:-4%}}
.op .cam{position:absolute;bottom:11.4%;height:40%;width:auto;max-width:none;object-fit:contain;transform:translateX(-50%);opacity:0;transition:opacity 1.4s,left .9s;image-rendering:pixelated;filter:drop-shadow(0 0 10px rgba(255,255,255,.55))}
.op .bar{position:absolute;left:0;right:0;background:#000;z-index:3;height:0!important;transition:none}
.op .bar.top{top:0}.op .bar.bot{bottom:0}
.op .stage.on .bar{height:11.5%}
.op .sub{position:absolute;inset:0;display:grid;place-items:center;text-align:center;white-space:nowrap;color:#fff;font-family:var(--display);font-size:calc(var(--u) * 4.2);letter-spacing:.1em;opacity:0;transition:opacity .9s}
.op .sub.show{opacity:1}
.op .card{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);color:#fff;opacity:0;z-index:2;transition:opacity 1.6s;pointer-events:none;letter-spacing:.3em;font-size:calc(var(--u) * 6)}
.op .card small{display:block;font-size:.45em;color:var(--gold);letter-spacing:.4em;margin-bottom:.6em}
.op .opskip{position:absolute;right:10px;top:10px;z-index:5;background:#000a}
.op .tbg{position:absolute;inset:0;background:linear-gradient(#03020a,#150f44 60%,#35276f)}
.op .opstart{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);z-index:5;opacity:0;pointer-events:none;transition:opacity 1.2s;font-family:var(--display);font-size:calc(var(--u) * 5.5);padding:.4em 1.5em;color:#fff;background:linear-gradient(#e0309a,#9b1d7a);border:calc(var(--u)*.6) solid #fff;border-radius:calc(var(--u)*1.2);box-shadow:0 0 calc(var(--u)*4) rgba(255,160,220,.7);cursor:pointer;letter-spacing:.3em}
.op .opstart.on{opacity:1;pointer-events:auto}
.op .logo2{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--display);font-size:calc(var(--u) * 17);line-height:1.05;color:#fff;text-shadow:calc(var(--u)*.9) calc(var(--u)*.9) 0 #b4157f,-2px -2px 0 #000;opacity:0;pointer-events:none;z-index:2;letter-spacing:.04em}
.op .logo2 img{display:block;margin:0 auto;width:min(86%,calc(var(--u)*120));image-rendering:pixelated;filter:drop-shadow(0 2px 6px rgba(80,60,160,.35))}
.op .logo2 small{display:block;margin-top:.3em;font-size:.2em;letter-spacing:.35em;color:#6a3fa0;text-shadow:none}
/* overlay *//* overlay */
.ov{position:fixed;inset:0;z-index:20;background:#0a0610ee;overflow-y:auto;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ov h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.steps{margin:0;padding-left:1.3em}
.steps li{margin:3px 0}

/* field */
.objective{display:flex;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:4px 10px;font-family:var(--display);font-size:13px}
.objective b{color:var(--gold);font-weight:400}
.objective span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{position:relative;flex:1;min-height:0;display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none}
.view{width:100%}
.view canvas{display:block;width:100%;height:100%;object-fit:contain;background:#05030c}
.fwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.fside{display:flex;flex-direction:column;gap:8px}
.fbanner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:88%;background:var(--ink);border:3px solid var(--gold);border-radius:4px;padding:4px 12px;text-align:center;pointer-events:none}
.fbanner b{display:block;color:var(--gold);font-weight:400;font-size:15px;font-family:var(--display)}
.fbanner span{font-size:11px;color:var(--mute)}
.pad{position:absolute;right:6px;bottom:6px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:3px;opacity:.82}
.pad button{background:#20162bcc;border:3px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;font-size:20px;touch-action:none}
.pad button.on{border-color:var(--accent);background:#3a2150}
.abtns{position:absolute;left:8px;bottom:10px;display:flex;gap:10px;align-items:flex-end}
.abtns button{width:54px;height:54px;border-radius:50%;background:#20162bcc;border:3px solid var(--line);color:var(--fg);font:inherit;font-size:16px;opacity:.85}
.abtns button+button{margin-bottom:22px}
.abtns button:active{border-color:var(--accent);background:#3a2150}
.gpad{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 6px}
.gpad[hidden]{display:none}
.dp{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:3px}
.dp .u{grid-area:1/2}.dp .l{grid-area:2/1}.dp .d{grid-area:2/2}.dp .r{grid-area:2/3}
.gpad button{background:linear-gradient(#26308f,#0a1160);color:#fff;border:2px solid #f4f4f4;border-radius:6px;font:inherit;font-size:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.gpad button:active{background:#3a4be0}
.ab2{display:flex;gap:12px;align-items:flex-end}
.ab2 button{width:54px;height:54px;border-radius:50%;font-size:18px}
.ab2 button+button{margin-bottom:20px}
.crow.sel{background:#1a2cc0;outline:2px solid #ffe27a;outline-offset:-2px}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}

/* DQ-style battle */
.bt{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.win{position:relative;background:linear-gradient(#0e1f9a,#050a4c);color:#fff;border:3px solid #f4f4f4;border-radius:8px;box-shadow:0 0 0 2px #000;padding:10px 12px;font-family:var(--display)}
.win .wt{position:absolute;top:-12px;left:12px;background:#07107a;border:2px solid #f4f4f4;border-radius:4px;padding:0 8px;font-size:12px;letter-spacing:.06em}
.btop{display:grid;grid-template-columns:1.1fr 1fr;gap:8px;margin-top:6px}
.btop .win{padding:12px 10px 8px;font-size:13px;line-height:1.5;min-width:0}
.btop .line{display:flex;justify-content:space-between;gap:6px;align-items:center}
.btop .line b{font-weight:400;font-variant-numeric:tabular-nums}
.btop .low{color:#ff8a7a}
.btop .mini{height:6px;border:1px solid #f4f4f4;background:#000;margin:1px 0 3px}
.btop .mini i{display:block;height:100%;background:#7dff8f;transition:width .35s steps(6)}
.btop .efoe .mini i{background:#ff8a7a}
.btop .chips{min-height:18px;gap:4px}
.btop .chip{background:#000;color:#fff;border:1px solid #f4f4f4;font-size:10px;padding:0 4px}
.btop .chip.def{color:#7fd0ff;border-color:#7fd0ff}.btop .chip.str{color:#ff9ae6;border-color:#ff9ae6}.btop .chip.weak{color:#ffe27a;border-color:#ffe27a}.btop .chip.sv{color:#7dff8f;border-color:#7dff8f}
.btop .energy i{border-color:#ffe27a}.btop .energy i.on{background:#ffe27a}
.btop .energy span{color:#ffe27a;font-size:12px}
.scene{position:relative;flex:1;min-height:140px;border:3px solid #f4f4f4;border-radius:6px;box-shadow:0 0 0 2px #000;overflow:hidden;background:#000}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.cameo{position:absolute;right:-34px;bottom:27%;height:40%;width:auto;image-rendering:pixelated;z-index:30;pointer-events:none;filter:drop-shadow(0 0 8px #ffe9a3);animation:cameo 1.6s ease-out forwards}
@keyframes cameo{0%{transform:translateX(50%);opacity:0}25%{transform:translateX(0);opacity:1}80%{opacity:1}100%{transform:translateX(0);opacity:0}}
.scene .efl{position:absolute;left:0;right:0;bottom:12%;height:62%;display:flex;justify-content:center;align-items:flex-end;gap:2%}
.scene.boss .efl{height:80%}
.scene .eu{position:relative;flex:1 1 0;min-width:0;max-width:46%}
.scene .eu:only-child{max-width:98%}
.scene.boss .efl{height:92%;bottom:4%}
.scene .esp{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;image-rendering:pixelated}
.eu.dead{visibility:hidden}
.scene .pty{position:absolute;left:0;right:0;bottom:2%;height:27%;display:flex;justify-content:center;align-items:flex-end;gap:3px;z-index:2}
.pm{height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.pm img{height:100%;width:auto;max-width:100%;image-rendering:pixelated;object-fit:contain;transition:filter .3s,opacity .3s,transform .3s;filter:drop-shadow(0 2px 0 #0006)}
.pm.ko img{filter:grayscale(1);opacity:.35;transform:rotate(80deg) translateX(6px)}
.pm.act{animation:lunge .55s ease-out}.pm.hurt img{animation:eblink .5s steps(1)}
@keyframes lunge{30%{transform:translateY(-18px)}60%{transform:translateY(-18px)}100%{transform:none}}

function sprite(seed,c1,c2,n=14){
  if(SPRIMG[seed])return SPRIMG[seed];
  if(SPR[seed])return SPR[seed];
  const r=rng(seed),half=Math.ceil(n/2),g=[];
  for(let y=0;y<n;y++){g[y]=Array(n).fill(0);
    for(let x=0;x<half;x++){
      const cy=Math.abs(y-n*.52)/(n/2);const p=.12+.65*(x/half)-.45*cy;
      let v=r()<p?(r()<.3?2:1):0;
      if(x===half-1&&y>1&&y<n-2)v=v||1;
      g[y][x]=v;g[y][n-1-x]=v;
    }}
  const ey=Math.round(n*.38),ex=half-3;
  [ex,n-1-ex].forEach(x=>{g[ey][x]=4;g[ey+1][x]=5;});
  const out=g.map(r=>r.slice());
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!g[y][x]){
    if((g[y-1]&&g[y-1][x])||(g[y+1]&&g[y+1][x])||g[y][x-1]||g[y][x+1])out[y][x]=3;}
  const pad=1,rows=[];for(let y=-pad;y<n+pad;y++){let s='';for(let x=-pad;x<n+pad;x++){const v=out[y]&&out[y][x];s+=v?'.abcde'[v]:'.'}rows.push(s)}
  return SPR[seed]=gridToURL(rows,{a:c1,b:c2,c:'#1a0f24',d:'#ffffff',e:'#1a0f24'});
}

const inRect=(H,x,y)=>x>=H.x&&x<H.x+H.w&&y>=H.y&&y<H.y+H.h;
function npcInit(p){
  const gs={};TW.npcs.filter(n=>n.c===NM.guard).forEach(n=>(gs[n.y]=gs[n.y]||[]).push(n));Object.values(gs).forEach(a=>a.sort((u,v)=>u.x-v.x).forEach((n,i)=>n.flip=i%2===1));
  TW.npcs.forEach(n=>{
    n.px=n.x*TT;n.py=n.y*TT;n.hx=n.x;n.hy=n.y;n.mv=false;n.wt=60+Math.floor(Math.random()*180);
    n.home=(p.houses||[]).find(H=>inRect(H,n.x,n.y))||null;
    {const id0=n.dsp||npcId(n);if(id0)['d','u','l','r'].forEach(d=>timg('sprites/ch_'+(id0==='dwf'?'dw':id0==='prottf'?'prott':id0)+'_'+d+'.png'))}
    const dyn=n.dsp||npcId(n),fixed=!dyn||n.k==='inn'||n.k==='shop'||n.still||(!n.dsp&&(n.stop||n.spr||n.sp));
    n.R=n.Rw!==undefined?n.Rw:fixed?0:(n.home?1:(n.dsp?1:(n.R??2)));
  });
}
function npcCan(n,x,y){
  const p=TW.pl;
  if(Math.abs(x-n.hx)>n.R||Math.abs(y-n.hy)>n.R)return false;
  if(x<0||y<0||x>=p.w||y>=p.h||p.sol[y][x])return false;
  if(TW.npcs.some(m=>m!==n&&(m.x===x&&m.y===y)))return false;
  if((TP.tx===x&&TP.ty===y)||(TP.moving&&TP.tgx===x&&TP.tgy===y))return false;
  if((p.warps||[]).some(w=>Math.abs(w.x-x)<=1&&Math.abs(w.y-y)<=1))return false;
  const hs=p.houses||[];
  if(n.home){if(!inRect(n.home,x,y)||x===n.home.x+n.home.dc&&y===n.home.y+n.home.h-1)return false}
  else if(hs.some(H=>x>=H.x-1&&x<=H.x+H.w&&y>=H.y&&y<=H.y+H.h))return false;
  if(p.stop&&!n.stop&&p.stop.x===x&&p.stop.y===y)return false;
  return true;
}
function npcStep(){
  TW.npcs.forEach(n=>{
    if(!n.R)return;
    if(n.mv){
      const gx=n.x*TT,gy=n.y*TT;
      n.px+=Math.sign(gx-n.px);n.py+=Math.sign(gy-n.py);
      if(n.px===gx&&n.py===gy){n.mv=false;n.wt=n.k==='mob'?20+Math.floor(Math.random()*40):70+Math.floor(Math.random()*200);if(n.turn){n.dir=n.turn;n.turn=null}}
      return}
    if(n.wt>0){n.wt--;return}
    const ds=['up','down','left','right'].sort(()=>Math.random()-.5);
    for(const d of ds){const[dx,dy]=VEC[d],nx=n.x+dx,ny=n.y+dy;
      if(npcCan(n,nx,ny)){n.dir=d;n.mvd=d;n.x=nx;n.y=ny;n.mv=true;return}}
    n.wt=40;
  });
}
function tpass(x,y){const p=TW.pl;if(x<0||y<0||x>=p.w||y>=p.h)return false;return!p.sol[y][x]&&!TW.npcs.some(n=>n.x===x&&n.y===y)}

function gainXP(n,done,inline){
  if(G.lv>=LVCAP)return done();
  G.xp+=n;
  if(G.xp<need(G.lv))return done();
  const a0=atkPow();
  G.xp-=need(G.lv);G.lv++;G.max+=HPGROW;G.hp=G.max;crAdd(8);sfx('verup');
  const ns=SKILLS.filter(s=>s.lv===G.lv&&!s.g&&!s.l),na=[],ng=[];
  if(inline){
    const ms=[`<b>${vname()}</b> に バージョンアップ！`,`さいだいHP +${HPGROW}　さいだいMP +2GB　こうげき +${atkPow()-a0}　HPが ぜんかいふく！`];
    if(ns.length)ms.push(`あたらしい わざ：<b>${ns.map(x=>x.n).join('、')}</b>`);
    if(na.length)ms.push(`なかまの あたらしい わざ：<b>${na.join('、')}</b>`);
    if(ng.length)ms.push(`ショップに あたらしい そうび：<b>${ng.join('、')}</b>`);
    return (async()=>{for(const m of ms){say(m);await wait(1300)}gainXP(0,done,true)})();
  }
  scene('バージョンアップ',`${vname()}に なった！`,
    `<p class="lead">さいだいHP +${HPGROW}　さいだいMP +2GB　こうげき +${atkPow()-a0}<br>HPが ぜんかいふく した！${ns.length?`<br>あたらしい わざ：<b>${ns.map(x=>x.n).join('、')}</b>`:''}${na.length?`<br>なかまの あたらしい わざ：<b>${na.join('、')}</b>`:''}${ng.length?`<br>ショップに あたらしい そうび：<b>${ng.join('、')}</b>`:''}</p>`,
    [{l:'つぎへ',s:'',f:()=>gainXP(0,done)}]);
}
